name: Quality & GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      RISE_SOCIAL_DB_PATH: data/ci-studio.sqlite
      PLAYWRIGHT_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:lfs
      - run: npm run verify:pages

  publish:
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Record the verified source revision
        run: printf '%s\n' "$GITHUB_SHA" > public-site/out/deployment.txt
      - name: Publish the verified static export
        run: |
          publish_dir="$(mktemp -d)"
          git fetch --no-tags origin gh-pages
          git worktree add --detach "$publish_dir" origin/gh-pages
          git -C "$publish_dir" switch --orphan pages-release
          cp -R public-site/out/. "$publish_dir"/
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$publish_dir" commit -m "deploy: ${GITHUB_SHA}"
          remote_revision="$(git rev-parse origin/gh-pages)"
          git -C "$publish_dir" push \
            --force-with-lease="gh-pages:${remote_revision}" \
            origin \
            HEAD:gh-pages

  live-smoke:
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Pages routes and markers
        env:
          BASE_URL: https://marosko123.github.io/rise-social/
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          deployed=false
          for attempt in $(seq 1 36); do
            revision="$(curl --fail --silent --show-error --location "${BASE_URL}deployment.txt" || true)"
            if [ "$revision" = "$EXPECTED_SHA" ]; then
              deployed=true
              break
            fi
            sleep 5
          done
          if [ "$deployed" != true ]; then
            echo "Expected deployed revision $EXPECTED_SHA was not observed."
            exit 1
          fi
          fetch() {
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              "${BASE_URL}$1" \
              --output "$smoke_dir/$2"
          }
          fetch "" root.html
          fetch "content-plan/" content-plan.html
          fetch "review/" review.html
          fetch "robots.txt" robots.txt
          fetch "sitemap.xml" sitemap.xml
          fetch "llms.txt" llms.txt
          fetch "visual-playbook/" visual-playbook.html
          fetch "visual-playbook.json" visual-playbook.json
          fetch "visual-playbook.md" visual-playbook.md
          fetch "visual-assets.json" visual-assets.json
          grep -F "90-dňový content plán" "$smoke_dir/root.html"
          grep -F "90-dňový content plán" "$smoke_dir/content-plan.html"
          grep -F "nič nie je publikované" "$smoke_dir/review.html"
          grep -F "$BASE_URL" "$smoke_dir/robots.txt"
          grep -F "$BASE_URL" "$smoke_dir/sitemap.xml"
          grep -F "$BASE_URL" "$smoke_dir/llms.txt"
          grep -F "Ako má ChatGPT tvoriť Rise vizuály" "$smoke_dir/visual-playbook.html"
          grep -F "rise-visual-generation-v1" "$smoke_dir/visual-playbook.json"
          grep -F "# Rise Visual System" "$smoke_dir/visual-playbook.md"
          grep -F "\"projects\"" "$smoke_dir/visual-assets.json"
          grep -F "\"assets\"" "$smoke_dir/visual-assets.json"
